name: Test, Build & Release nouveau-utils Packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-suite:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit & integration test suite
        run: |
          make check

      - name: Verify Makefile install staging layout
        run: |
          make install DESTDIR=/tmp/nouveau-utils-stage
          test -x /tmp/nouveau-utils-stage/usr/bin/nouveau-ctrl
          test -x /tmp/nouveau-utils-stage/usr/bin/nouveau-tui
          test -x /tmp/nouveau-utils-stage/usr/bin/nouveau-dynclockd.py
          test -x /tmp/nouveau-utils-stage/usr/bin/nouveau-recover
          test -L /tmp/nouveau-utils-stage/usr/bin/nouveau-dynclockd
          test -f /tmp/nouveau-utils-stage/etc/nouveau-dynclockd.conf
          test -f /tmp/nouveau-utils-stage/usr/lib/systemd/system/nouveau-dynclockd.service
          test -f /tmp/nouveau-utils-stage/usr/lib/systemd/system/nouveau-recover.service
          test -f /tmp/nouveau-utils-stage/usr/lib/udev/rules.d/99-nouveau-recover.rules

  build-arch:
    name: Build Arch Linux Package (.pkg.tar.zst)
    needs: test-suite
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare unprivileged builder
        run: |
          pacman -Syu --noconfirm git python
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run test suite on Arch Linux Python 3.14 & build package
        run: |
          su builder -c "make check && makepkg -s --nodeps --noconfirm"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nouveau-utils-arch-pkg
          path: "*.pkg.tar.zst"

  build-debian:
    name: Build Debian / Ubuntu Package (.deb)
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dpkg-dev

      - name: Setup Debian packaging structure
        run: |
          cp -r packaging/debian .

      - name: Build Debian binary package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/deb
          cp ../*.deb dist/deb/

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nouveau-utils-debian-deb
          path: dist/deb/*.deb

  build-rpm:
    name: Build Fedora / RHEL Package (.rpm)
    needs: test-suite
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf install -y systemd-rpm-macros rpm-build rpmdevtools

      - name: Prepare RPM build environment
        run: |
          rpmdev-setuptree
          cp packaging/rpm/nouveau-utils.spec ~/rpmbuild/SPECS/
          cp nouveau-dynclockd.conf nouveau-dynclockd.py nouveau-dynclockd.service \
             nouveau-ctrl nouveau-tui apps.conf.sample \
             nouveau-recover nouveau-recover.service 99-nouveau-recover.rules \
             ~/rpmbuild/SOURCES/

      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/nouveau-utils.spec
          mkdir -p dist/rpm
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/rpm/

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nouveau-utils-fedora-rpm
          path: dist/rpm/*.rpm

  bundle-packages:
    name: Bundle Install-Ready Distro Packages
    needs: [build-arch, build-debian, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & CI Summary
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          {
            echo "## 📦 Install-Ready \`nouveau-utils\` Packages"
            echo ""
            echo "| Distribution Family | Artifact Name | Install Command |"
            echo "| :--- | :--- | :--- |"
            echo "| **Arch Linux / CachyOS / Manjaro** | \`nouveau-utils-arch-pkg\` | \`sudo pacman -U nouveau-utils-*.pkg.tar.zst\` |"
            echo "| **Debian / Ubuntu / Mint / Pop!_OS** | \`nouveau-utils-debian-deb\` | \`sudo apt install ./nouveau-utils_*.deb\` |"
            echo "| **Fedora / RHEL / openSUSE** | \`nouveau-utils-fedora-rpm\` | \`sudo dnf install ./nouveau-utils-*.noarch.rpm\` |"
            echo ""
            echo "### Checksums (\`SHA256SUMS.txt\`)"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified multi-distro package bundle
        uses: actions/upload-artifact@v4
        with:
          name: nouveau-utils-all-distros
          path: release-assets/*

  release:
    name: Publish Release Assets to GitHub
    needs: [bundle-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unified package bundle
        uses: actions/download-artifact@v4
        with:
          name: nouveau-utils-all-distros
          path: release-assets

      - name: Attach artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG: nouveau-utils governance and telemetry suite"
          fi
          gh release upload "$TAG" release-assets/* --clobber
